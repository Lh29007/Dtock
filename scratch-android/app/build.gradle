plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dtock.scratch'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dtock.scratch'
        // Android 5.0 : couvre la plupart des téléphones armv7a encore en usage.
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // WebViewAssetLoader : sert les fichiers de assets/ sous une origine https
    // (nécessaire pour les workers, le stockage local et les chemins absolus de scratch-gui).
    implementation 'androidx.webkit:webkit:1.11.0'
}
