name: Scratch Android (armv7a)

on:
  push:
    paths:
      - '.github/workflows/build-scratch-android-armv7a.yml'
      - 'scratch-android/**'
  workflow_dispatch:
    inputs:
      scratch_gui_ref:
        description: 'Branche ou tag de LLK/scratch-gui à compiler'
        required: false
        default: 'develop'

permissions:
  contents: read

jobs:
  build:
    name: APK Scratch (armeabi-v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer Dtock
        uses: actions/checkout@v4

      - name: Récupérer scratch-gui (éditeur officiel, BSD-3)
        uses: actions/checkout@v4
        with:
          repository: LLK/scratch-gui
          ref: ${{ github.event.inputs.scratch_gui_ref || 'develop' }}
          path: scratch-gui
          fetch-depth: 1

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compiler scratch-gui
        working-directory: scratch-gui
        env:
          # scratch-gui peut utiliser webpack 4 : nécessaire sur Node 17+.
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm ci || npm install
          npm run build
          test -f build/index.html

      - name: Copier l'éditeur dans les assets Android
        run: |
          ASSETS=scratch-android/app/src/main/assets
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp -r scratch-gui/build/. "$ASSETS/"
          test -f "$ASSETS/index.html"
          du -sh "$ASSETS"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer les composants SDK Android (API 34)
        run: |
          SDKM=$(find "$ANDROID_HOME" -path "*cmdline-tools*" -name sdkmanager -type f 2>/dev/null | head -n1)
          test -n "$SDKM" || { echo "sdkmanager introuvable"; exit 1; }
          yes 2>/dev/null | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Compiler l'APK debug
        working-directory: scratch-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Vérifier l'APK (aucune bibliothèque native, ARMv7 uniquement si présente)
        run: |
          APK=$(find scratch-android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          test -n "$APK" || { echo "APK introuvable"; exit 1; }
          echo "APK : $APK ($(stat -c %s "$APK") octets)"
          echo "Entrées lib/ :"
          unzip -l "$APK" | grep -E ' lib/' || echo "(aucune — pas de code natif)"
          cp "$APK" "$RUNNER_TEMP/scratch-android-armv7a.apk"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: scratch-android-armv7a
          path: ${{ runner.temp }}/scratch-android-armv7a.apk
          if-no-files-found: error
          retention-days: 30
