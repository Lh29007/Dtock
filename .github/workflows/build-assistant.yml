name: Build XonaAssist APK

on:
  push:
    branches: [ xonaassist ]
    paths:
      - 'android-assistant/**'
      - '.github/workflows/build-assistant.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          cd android-assistant
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XonaAssist-release-run${{ github.run_number }}
          path: android-assistant/app/build/outputs/apk/release/*armeabi-v7a*.apk
          if-no-files-found: error

      - name: Save logs to repository
        if: always()
        run: |
          mkdir -p logs
          LOG="logs/build-${{ github.run_number }}.log"
          {
            echo "run: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "job status: ${{ job.status }}"
            echo "----- gradle output -----"
            if [ -f build.log ]; then cat build.log; else echo "(aucun log gradle)"; fi
          } > "$LOG"
          cp "$LOG" logs/latest.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs
          if git diff --cached --quiet; then
            echo "Aucun log à committer."
          else
            git commit -m "CI logs: run ${{ github.run_number }} (${{ job.status }})"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
