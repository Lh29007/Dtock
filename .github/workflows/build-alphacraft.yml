name: Build AlphaCraft

on:
  push:
    branches: [main]
    paths:
      - 'alphacraft/**'
      - '.github/workflows/build-alphacraft.yml'
    tags: ['alphacraft-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compiler AlphaCraft.3dsx
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer le dossier de logs
        run: mkdir -p "$RUNNER_TEMP/logs"

      - name: Vérifier libctru et mbedTLS (devkitPro)
        run: |
          # L'image devkitpro/devkitarm contient déjà libctru. On n'installe que si ça manque.
          # Tout est écrit dans install.log (visible dans le résumé du run en cas d'échec).
          {
            echo "== Contenu initial de l'image =="
            ls -la /opt/devkitpro || true
            ls -la /opt/devkitpro/libctru /opt/devkitpro/portlibs/3ds 2>&1 || true
            dkp-pacman -Q 2>&1 | grep -iE "libctru|3ds|mbedtls" || true
          } 2>&1 | tee -a "$RUNNER_TEMP/logs/install.log"
          if [ -f /opt/devkitpro/libctru/lib/libctru.a ]; then
            echo "libctru déjà présent, pas d'installation." | tee -a "$RUNNER_TEMP/logs/install.log"
          else
            echo "libctru absent : installation via dkp-pacman." | tee -a "$RUNNER_TEMP/logs/install.log"
            dkp-pacman -Sy --noconfirm 2>&1 | tee -a "$RUNNER_TEMP/logs/install.log"
            dkp-pacman -S --needed --noconfirm 3ds-dev 2>&1 | tee -a "$RUNNER_TEMP/logs/install.log"
          fi
          test -f /opt/devkitpro/libctru/lib/libctru.a

      - name: Compiler
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          # Tout ce que l'étape écrit (stdout et stderr) est copié dans build.log.
          exec > >(tee -a "$RUNNER_TEMP/logs/build.log") 2>&1
          echo "== Diagnostic =="
          echo "pwd=$(pwd) | workspace=$GITHUB_WORKSPACE | DEVKITPRO=${DEVKITPRO:-vide}"
          cd "$GITHUB_WORKSPACE/alphacraft"
          echo "dans $(pwd)"
          ls -la
          echo "== make =="
          mkdir -p build
          make -j"$(nproc)"

      - name: Vérifier le résultat
        run: |
          cd "$GITHUB_WORKSPACE/alphacraft"
          test -f AlphaCraft.3dsx || { echo "AlphaCraft.3dsx absent après compilation" | tee -a "$RUNNER_TEMP/logs/build.log"; exit 1; }
          ls -la AlphaCraft.3dsx

      - name: Garder le binaire en artefact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlphaCraft-3dsx
          path: alphacraft/AlphaCraft.3dsx
          if-no-files-found: error

      - name: Publier les logs (toujours, y compris en cas d'échec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlphaCraft-logs
          path: ${{ runner.temp }}/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Publier le log dans la repo (ci-logs/alphacraft-latest.log)
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          # Le conteneur devkitPro n'a pas forcément git, et son utilisateur n'est pas propriétaire du dépôt.
          command -v git >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq git >/dev/null)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p ci-logs
          {
            echo "=== Run ${GITHUB_RUN_ID} | commit ${GITHUB_SHA} | statut du job : ${{ job.status }} ==="
            for f in "$RUNNER_TEMP/logs/install.log" "$RUNNER_TEMP/logs/build.log"; do
              echo ""
              echo "----- $(basename "$f") -----"
              cat "$f" 2>/dev/null || echo "(absent)"
            done
          } > ci-logs/alphacraft-latest.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-logs/alphacraft-latest.log
          if git diff --cached --quiet; then
            echo "Log inchangé."
            exit 0
          fi
          git commit -q -m "Log CI AlphaCraft (run ${GITHUB_RUN_ID})"
          git pull -q --rebase origin main || true
          git push origin HEAD:main

      - name: Résumé des erreurs dans la page du run
        if: failure()
        run: |
          {
            echo "## Échec du build AlphaCraft"
            echo ""
            echo "### Installation devkitPro (fin du log)"
            echo ""
            echo '```'
            tail -n 40 "$RUNNER_TEMP/logs/install.log" 2>/dev/null || echo "(pas de log d'installation)"
            echo '```'
            echo ""
            echo "### Compilation (fin du log)"
            echo ""
            echo '```'
            tail -n 80 "$RUNNER_TEMP/logs/build.log" 2>/dev/null || echo "(compilation non lancée)"
            echo '```'
            echo ""
            echo "Log complet : artefact **AlphaCraft-logs** en bas de cette page."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publier dans les releases
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'

    steps:
      - name: Télécharger le binaire
        uses: actions/download-artifact@v4
        with:
          name: AlphaCraft-3dsx
          path: dist

      - name: Créer ou mettre à jour la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('alphacraft-build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('AlphaCraft (build {0})', github.run_number) }}
          body: |
            Build automatique de `AlphaCraft.3dsx` (commit `${{ github.sha }}`).

            Installation : copie le fichier sur la carte SD dans `/3ds/AlphaCraft/AlphaCraft.3dsx`,
            puis lance-le depuis le Homebrew Launcher.
          files: dist/AlphaCraft.3dsx
          fail_on_unmatched_files: true
