name: Build hack.chat V2 (hackchat3dsV2.3dsx)

on:
  push:
    branches: [main]
    paths:
      - 'hackchat-3ds-v2/**'
      - '.github/workflows/build-hackchat-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compiler hackchat3dsV2.3dsx
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Mettre à jour les dépôts devkitPro
        run: |
          for attempt in 1 2 3; do
            dkp-pacman -Syu --noconfirm && break
            echo "Mise à jour échouée (essai $attempt)"
            [ "$attempt" -eq 3 ] && exit 1
            sleep 20
          done

      - name: Vérifier les paquets disponibles
        run: dkp-pacman -Ss 3ds- | grep -E 'citro|mbedtls|3ds-dev' || true

      - name: Installer 3ds-dev et mbedTLS
        run: |
          for attempt in 1 2 3; do
            dkp-pacman -S --needed --noconfirm 3ds-dev 3ds-mbedtls && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 20
          done

      - name: Installer citro2d
        run: |
          for attempt in 1 2 3; do
            dkp-pacman -S --needed --noconfirm 3ds-citro2d && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 20
          done

      - name: Embarquer les certificats racine (romfs)
        working-directory: hackchat-3ds-v2
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates >/dev/null
          mkdir -p romfs
          cp /etc/ssl/certs/ca-certificates.crt romfs/cacert.pem

      - name: Compiler
        working-directory: hackchat-3ds-v2
        run: make -j"$(nproc)"

      - name: Préparer le fichier de sortie
        working-directory: hackchat-3ds-v2
        run: |
          mkdir -p out
          cp hackchat3dsV2.3dsx out/hackchat3dsV2.3dsx

      - name: Garder le binaire en artefact
        uses: actions/upload-artifact@v4
        with:
          name: hackchat3dsV2
          path: hackchat-3ds-v2/out/hackchat3dsV2.3dsx
          if-no-files-found: error

  release:
    name: Publier dans les releases
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Télécharger le binaire
        uses: actions/download-artifact@v4
        with:
          name: hackchat3dsV2
          path: dist

      - name: Créer la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('hackchat-v2-build-{0}', github.run_number) }}
          name: ${{ format('hack.chat V2 (build {0})', github.run_number) }}
          body: |
            Build automatique de `hackchat3dsV2.3dsx` (commit `${{ github.sha }}`).

            Interface graphique : journal du salon, panneau des utilisateurs (X),
            liste des salons publics, quitter le salon, saisie au clavier natif.
            Installation : copie le fichier sur la carte SD dans `/3ds/hackchat3dsV2/hackchat3dsV2.3dsx`
            puis lance-le depuis le Homebrew Launcher.
          files: dist/hackchat3dsV2.3dsx
          fail_on_unmatched_files: true
