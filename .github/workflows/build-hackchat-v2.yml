name: Build hack.chat V2 (hackchat3dsV2.3dsx)

on:
  push:
    branches: [main]
    paths:
      - 'hackchat-3ds-v2/**'
      - '.github/workflows/build-hackchat-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compiler hackchat3dsV2.3dsx
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    defaults:
      run:
        shell: bash -eo pipefail {0}

    env:
      # Chaque étape ajoute sa sortie ici ; le log est commité dans le repo à la fin.
      CI_LOG: ci-logs/build.log

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer le log
        run: |
          mkdir -p ci-logs
          : > "$CI_LOG"

      - name: Mettre à jour les dépôts devkitPro
        run: |
          {
            for attempt in 1 2 3; do
              dkp-pacman -Syu --noconfirm && break
              echo "Mise à jour échouée (essai $attempt)"
              [ "$attempt" -eq 3 ] && exit 1
              sleep 20
            done
          } 2>&1 | tee -a "$CI_LOG"

      - name: Installer 3ds-dev et mbedTLS
        run: |
          {
            for attempt in 1 2 3; do
              dkp-pacman -S --needed --noconfirm 3ds-dev 3ds-mbedtls && break
              [ "$attempt" -eq 3 ] && exit 1
              sleep 20
            done
          } 2>&1 | tee -a "$CI_LOG"

      - name: Compiler citro3d v1.6.0 depuis GitHub
        run: |
          {
            apt-get update -qq
            apt-get install -y -qq git bzip2 >/dev/null
            rm -rf /tmp/citro3d
            git clone --depth 1 --branch v1.6.0 https://github.com/devkitPro/citro3d.git /tmp/citro3d
            # libctru avertit si -D_3DS est défini sans __3DS__ (et -Werror le transforme en erreur)
            # ALIGN(x) n'existe plus dans la libctru actuelle : fourni par compat/align.h
            sed -i 's/-DARM11 -D_3DS/-DARM11 -D_3DS -D__3DS__ -include $(ALIGN_H) -Wno-error/' /tmp/citro3d/Makefile
            grep -n "ALIGN_H" /tmp/citro3d/Makefile
            make -C /tmp/citro3d -j"$(nproc)"
            make -C /tmp/citro3d install
          } 2>&1 | tee -a "$CI_LOG"
        env:
          ALIGN_H: ${{ github.workspace }}/hackchat-3ds-v2/compat/align.h

      - name: Compiler citro2d v1.6.0 depuis GitHub
        run: |
          {
            rm -rf /tmp/citro2d
            git clone --depth 1 --branch v1.6.0 https://github.com/devkitPro/citro2d.git /tmp/citro2d
            sed -i 's/-DCITRO2D_BUILD/-D_3DS -D__3DS__ -DCITRO2D_BUILD -include $(ALIGN_H) -Wno-error -Wno-return-mismatch/' /tmp/citro2d/Makefile
            grep -n "ALIGN_H" /tmp/citro2d/Makefile
            make -C /tmp/citro2d -j"$(nproc)"
            make -C /tmp/citro2d install
          } 2>&1 | tee -a "$CI_LOG"
        env:
          ALIGN_H: ${{ github.workspace }}/hackchat-3ds-v2/compat/align.h

      - name: Embarquer les certificats racine (romfs)
        working-directory: hackchat-3ds-v2
        run: |
          {
            apt-get install -y -qq ca-certificates >/dev/null
            mkdir -p romfs
            cp /etc/ssl/certs/ca-certificates.crt romfs/cacert.pem
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/$CI_LOG"

      - name: Compiler
        working-directory: hackchat-3ds-v2
        run: |
          make -j"$(nproc)" 2>&1 | tee -a "$GITHUB_WORKSPACE/$CI_LOG"

      - name: Préparer le fichier de sortie
        working-directory: hackchat-3ds-v2
        run: |
          mkdir -p out
          cp hackchat3dsV2.3dsx out/hackchat3dsV2.3dsx

      - name: Garder le binaire en artefact
        uses: actions/upload-artifact@v4
        with:
          name: hackchat3dsV2
          path: hackchat-3ds-v2/out/hackchat3dsV2.3dsx
          if-no-files-found: error

      - name: Publier le log de build dans le repo
        if: always()
        run: |
          apt-get install -y -qq git >/dev/null 2>&1 || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          {
            echo "=== Run ${GITHUB_RUN_ID} — statut du job : ${{ job.status }} ==="
            cat "$CI_LOG"
          } > ci-logs/hackchat-v2-latest.log
          rm -f "$CI_LOG"
          git add ci-logs/hackchat-v2-latest.log
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Log CI hack.chat V2 (run ${GITHUB_RUN_ID})" || exit 0
          git push origin HEAD:main || echo "push du log impossible"

  release:
    name: Publier dans les releases
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Télécharger le binaire
        uses: actions/download-artifact@v4
        with:
          name: hackchat3dsV2
          path: dist

      - name: Créer la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('hackchat-v2-build-{0}', github.run_number) }}
          name: ${{ format('hack.chat V2 (build {0})', github.run_number) }}
          body: |
            Build automatique de `hackchat3dsV2.3dsx` (commit `${{ github.sha }}`).

            Interface graphique : journal du salon, panneau des utilisateurs (X),
            liste des salons publics, quitter le salon, saisie au clavier natif.
            Installation : copie le fichier sur la carte SD dans `/3ds/hackchat3dsV2/hackchat3dsV2.3dsx`
            puis lance-le depuis le Homebrew Launcher.
          files: dist/hackchat3dsV2.3dsx
          fail_on_unmatched_files: true
